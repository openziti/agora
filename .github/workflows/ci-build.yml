name: CI Build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

# cancel older, redundant builds that haven't started yet
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    name: Build Linux AMD64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # push's ci/version.sh runs `git describe --tags`; full history + tags required
          fetch-depth: 0

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod

      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # build the embedded UI bundle before the go build so the binary embeds
      # the current ui/ source (ui/embed.go embeds ui/dist via go:embed).
      - name: build ui
        working-directory: ./ui
        run: |
          npm ci
          npm run lint
          npm run build

      # clone push's ci scripts at the pinned tag to stamp build metadata into the
      # agora binary (push's ldflags.sh hardcodes PKG=github.com/michaelquigley/push/build,
      # which agora consumes directly).
      - name: fetch push ci scripts
        run: git clone --branch v0.2.1 --depth 1 https://github.com/michaelquigley/push.git _push

      - name: install
        run: |
          LDFLAGS=$(_push/ci/ldflags.sh)
          go install -ldflags "${LDFLAGS}" ./...

      # fail the build if the binary is unstamped, so dev/branch artifacts carry a real version
      - name: verify stamp
        run: |
          out=$("$(go env GOPATH)/bin/agora" version)
          if [ -z "${out}" ] || printf '%s\n' "${out}" | grep -F '[developer build]'; then
            printf '%s\n' "${out}"
            exit 1
          fi

      - name: test
        run: |
          go test ./... -count=1
          go vet ./...

      - name: solve GOBIN
        id: solve_go_bin
        shell: bash
        run: |
          echo DEBUG: go_path="$(go env GOPATH)"
          echo go_bin="$(go env GOPATH)/bin" >> $GITHUB_OUTPUT

      - name: upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: |
            ${{ steps.solve_go_bin.outputs.go_bin }}/agora
          if-no-files-found: error
