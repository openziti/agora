version: 2
builds:
- id: agora-darwin-amd64
  main: ./cmd/agora
  binary: agora
  ldflags:
    - -s -w
    - -X github.com/michaelquigley/push/build.Version={{.Tag}}
    - -X github.com/michaelquigley/push/build.Hash={{.ShortCommit}}
    - -X github.com/michaelquigley/push/build.Date={{.Date}}
    - -X github.com/michaelquigley/push/build.Builder=goreleaser
    - -X github.com/michaelquigley/push/build.Branch={{.Branch}}
    - -X github.com/michaelquigley/push/build.CGO=0
  env:
    - CGO_ENABLED=0
  goos:
    - darwin
  goarch:
    - amd64

- id: agora-darwin-arm64
  main: ./cmd/agora
  binary: agora
  ldflags:
    - -s -w
    - -X github.com/michaelquigley/push/build.Version={{.Tag}}
    - -X github.com/michaelquigley/push/build.Hash={{.ShortCommit}}
    - -X github.com/michaelquigley/push/build.Date={{.Date}}
    - -X github.com/michaelquigley/push/build.Builder=goreleaser
    - -X github.com/michaelquigley/push/build.Branch={{.Branch}}
    - -X github.com/michaelquigley/push/build.CGO=0
  env:
    - CGO_ENABLED=0
  goos:
    - darwin
  goarch:
    - arm64
