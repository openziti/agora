version: 2
builds:
- id: agora-amd64
  main: ./cmd/agora
  binary: agora
  ldflags:
    - -s -w
    - -X github.com/openziti/agora/build.Version={{.Tag}}
    - -X github.com/openziti/agora/build.Hash={{.ShortCommit}}
    - -X github.com/openziti/agora/build.Date={{.Date}}
    - -X github.com/openziti/agora/build.BuiltBy=goreleaser
  env:
    - CGO_ENABLED=0
  goos:
    - linux
  goarch:
    - amd64
