/sessions:
  post:
    tags:
      - sessions
    operationId: proposeSession
    security:
      - accountTokenAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../agora.yml#/components/schemas/proposeSessionRequest"
    responses:
      201:
        description: proposed
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/session"
      400:
        description: bad request
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      401:
        description: unauthorized
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      404:
        description: not found
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      409:
        description: conflict
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      500:
        description: internal server error
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
  get:
    tags:
      - sessions
    operationId: listSessions
    security:
      - accountTokenAuth: []
    parameters:
      - name: state
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: "../agora.yml#/components/schemas/sessionState"
        style: form
        explode: true
      - name: role
        in: query
        required: false
        schema:
          type: string
          enum: [provider, consumer, both]
      - name: advertisementId
        in: query
        required: false
        schema:
          type: string
          pattern: '^adv_[a-z0-9]{12}$'
    responses:
      200:
        description: ok
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/listSessionsResponse"
      400:
        description: bad request
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      401:
        description: unauthorized
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      500:
        description: internal server error
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"

