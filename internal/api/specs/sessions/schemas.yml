session:
  type: object
  required:
    - id
    - advertisementId
    - workgroupId
    - providerAccountId
    - providerOrganizationId
    - consumerAccountId
    - consumerOrganizationId
    - advertisementName
    - workgroupName
    - providerOrganizationName
    - consumerOrganizationName
    - tunnelMode
    - state
    - proposedAt
  properties:
    id:
      type: string
      pattern: '^ses_[a-z0-9]{12}$'
    advertisementId:
      type: string
      pattern: '^adv_[a-z0-9]{12}$'
    workgroupId:
      type: string
      pattern: '^wg_[a-z0-9]{12}$'
    providerAccountId:
      type: string
      pattern: '^ac_[a-z0-9]{12}$'
    providerOrganizationId:
      type: string
      pattern: '^org_[a-z0-9]{12}$'
    consumerAccountId:
      type: string
      pattern: '^ac_[a-z0-9]{12}$'
    consumerOrganizationId:
      type: string
      pattern: '^org_[a-z0-9]{12}$'
    advertisementName:
      type: string
    workgroupName:
      type: string
    providerOrganizationName:
      type: string
    consumerOrganizationName:
      type: string
    providerAccountEmail:
      type: string
      format: email
    consumerAccountEmail:
      type: string
      format: email
    tunnelMode:
      $ref: "../agora.yml#/components/schemas/advertisementTunnelMode"
    tunnelId:
      type: string
    state:
      $ref: "#/sessionState"
    closeReason:
      $ref: "#/sessionCloseReason"
    closeDetail:
      type: string
    proposerMessage:
      type: string
    proposedAt:
      type: string
      format: date-time
    acceptedAt:
      type: string
      format: date-time
    closedAt:
      type: string
      format: date-time
    contractSnapshot:
      $ref: "../agora.yml#/components/schemas/contractSnapshot"
    envelopeCount:
      type: integer
      minimum: 0

sessionState:
  type: string
  enum: [proposed, accepting, active, closing, closed]

sessionCloseReason:
  type: string
  enum:
    - rejected
    - consumer_close
    - provider_close
    - contract_violation
    - tunnel_failed
    - admin_close
    - workgroup_deleted
    - environment_disabled

proposeSessionRequest:
  type: object
  required:
    - advertisementId
    - workgroupId
  properties:
    advertisementId:
      type: string
      pattern: '^adv_[a-z0-9]{12}$'
    workgroupId:
      type: string
      pattern: '^wg_[a-z0-9]{12}$'
    proposerMessage:
      type: string

acceptSessionRequest:
  type: object
  required:
    - environmentId
  properties:
    environmentId:
      type: string
      pattern: '^ev_[a-z0-9]{12}$'
    backendAddress:
      type: string
      description: Local TCP address the provider will serve on; used as the tunnel backend_target. When omitted, a placeholder is stored and envelope transport is not functional.

reportEnvelopeCountRequest:
  type: object
  required:
    - count
    - observedAt
  properties:
    count:
      type: integer
      minimum: 0
    observedAt:
      type: string
      format: date-time

closeSessionRequest:
  type: object
  properties:
    detail:
      type: string
    reason:
      $ref: "#/sessionCloseReason"

listSessionsResponse:
  type: array
  items:
    $ref: "#/session"
