/contracts:
  post:
    tags:
      - contracts
    operationId: createContract
    security:
      - accountTokenAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../agora.yml#/components/schemas/createContractRequest"
    responses:
      201:
        description: created
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/contract"
      400:
        description: bad request
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      401:
        description: unauthorized
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      403:
        description: forbidden
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      409:
        description: conflict
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      500:
        description: internal server error
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
  get:
    tags:
      - contracts
    operationId: listContracts
    security:
      - accountTokenAuth: []
    responses:
      200:
        description: ok
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/listContractsResponse"
      401:
        description: unauthorized
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      500:
        description: internal server error
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"

/contracts/{contractId}:
  get:
    tags:
      - contracts
    operationId: getContract
    security:
      - accountTokenAuth: []
    parameters:
      - name: contractId
        in: path
        required: true
        schema:
          type: string
          pattern: '^con_[a-z0-9]{12}$'
    responses:
      200:
        description: ok
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/contract"
      401:
        description: unauthorized
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      404:
        description: not found
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      500:
        description: internal server error
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
  patch:
    tags:
      - contracts
    operationId: updateContract
    security:
      - accountTokenAuth: []
    parameters:
      - name: contractId
        in: path
        required: true
        schema:
          type: string
          pattern: '^con_[a-z0-9]{12}$'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../agora.yml#/components/schemas/updateContractRequest"
    responses:
      200:
        description: ok
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/contract"
      400:
        description: bad request
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      401:
        description: unauthorized
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      403:
        description: forbidden
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      404:
        description: not found
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      409:
        description: conflict
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      500:
        description: internal server error
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
  delete:
    tags:
      - contracts
    operationId: deleteContract
    security:
      - accountTokenAuth: []
    parameters:
      - name: contractId
        in: path
        required: true
        schema:
          type: string
          pattern: '^con_[a-z0-9]{12}$'
    responses:
      204:
        description: deleted
      401:
        description: unauthorized
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      403:
        description: forbidden
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      404:
        description: not found
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      409:
        description: conflict
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      500:
        description: internal server error
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
