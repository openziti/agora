auditEventType:
  type: string
  enum:
    - session.proposed
    - session.accepted
    - session.rejected
    - session.closed
    - envelope.flowed
    - tunnel.attached
    - tunnel.detached
    - advertisement.published
    - advertisement.retracted
    - environment.heartbeat
    - account.login
    - account.login_failed
    - account.logout

auditEventData:
  type: object
  additionalProperties: true

auditEvent:
  type: object
  required:
    - id
    - occurredAt
    - eventType
    - organizationId
    - data
  properties:
    id:
      type: integer
      format: int64
      minimum: 1
    occurredAt:
      type: string
      format: date-time
    eventType:
      $ref: "#/auditEventType"
    organizationId:
      type: string
      pattern: '^org_[a-z0-9]{12}$'
    accountId:
      type: string
    workgroupId:
      type: string
    sessionId:
      type: string
    advertisementId:
      type: string
    contractId:
      type: string
    envelopeId:
      type: string
    data:
      $ref: "#/auditEventData"

listAuditEventsResponse:
  type: object
  required:
    - items
  properties:
    items:
      type: array
      items:
        $ref: "#/auditEvent"
    nextCursor:
      type: string
