/workgroups:
  get:
    tags:
      - workgroups
    operationId: listWorkgroups
    security:
      - accountTokenAuth: []
    responses:
      200:
        description: ok
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/listWorkgroupsResponse"
      401:
        description: unauthorized
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      500:
        description: internal server error
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"

/workgroups/{workgroupId}:
  get:
    tags:
      - workgroups
    operationId: getWorkgroup
    security:
      - accountTokenAuth: []
    parameters:
      - name: workgroupId
        in: path
        required: true
        schema:
          type: string
          pattern: '^wg_[a-z0-9]{12}$'
    responses:
      200:
        description: ok
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/workgroup"
      401:
        description: unauthorized
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      404:
        description: not found
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      500:
        description: internal server error
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
  delete:
    tags:
      - workgroups
    operationId: deleteWorkgroup
    security:
      - accountTokenAuth: []
    parameters:
      - name: workgroupId
        in: path
        required: true
        schema:
          type: string
          pattern: '^wg_[a-z0-9]{12}$'
    responses:
      204:
        description: deleted
      401:
        description: unauthorized
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      403:
        description: forbidden
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      404:
        description: not found
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      500:
        description: internal server error
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"

