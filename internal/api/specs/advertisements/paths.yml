/advertisements:
  post:
    tags:
      - advertisements
    operationId: publishAdvertisement
    security:
      - accountTokenAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../agora.yml#/components/schemas/publishAdvertisementRequest"
    responses:
      201:
        description: created
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/advertisement"
      400:
        description: bad request
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      401:
        description: unauthorized
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      403:
        description: forbidden
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      409:
        description: conflict
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      500:
        description: internal server error
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
  get:
    tags:
      - advertisements
    operationId: listAdvertisements
    security:
      - accountTokenAuth: []
    parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: "../agora.yml#/components/schemas/advertisementStatus"
    responses:
      200:
        description: ok
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/listAdvertisementsResponse"
      401:
        description: unauthorized
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      500:
        description: internal server error
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"

/advertisements/{advertisementId}:
  get:
    tags:
      - advertisements
    operationId: getAdvertisement
    security:
      - accountTokenAuth: []
    parameters:
      - name: advertisementId
        in: path
        required: true
        schema:
          type: string
          pattern: '^adv_[a-z0-9]{12}$'
    responses:
      200:
        description: ok
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/advertisement"
      401:
        description: unauthorized
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      404:
        description: not found
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      500:
        description: internal server error
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
  patch:
    tags:
      - advertisements
    operationId: updateAdvertisement
    security:
      - accountTokenAuth: []
    parameters:
      - name: advertisementId
        in: path
        required: true
        schema:
          type: string
          pattern: '^adv_[a-z0-9]{12}$'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../agora.yml#/components/schemas/updateAdvertisementRequest"
    responses:
      200:
        description: ok
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/advertisement"
      400:
        description: bad request
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      401:
        description: unauthorized
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      403:
        description: forbidden
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      404:
        description: not found
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      409:
        description: conflict
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      500:
        description: internal server error
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
  delete:
    tags:
      - advertisements
    operationId: retractAdvertisement
    security:
      - accountTokenAuth: []
    parameters:
      - name: advertisementId
        in: path
        required: true
        schema:
          type: string
          pattern: '^adv_[a-z0-9]{12}$'
    responses:
      204:
        description: retracted
      401:
        description: unauthorized
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      403:
        description: forbidden
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      404:
        description: not found
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
      500:
        description: internal server error
        content:
          application/json:
            schema:
              $ref: "../agora.yml#/components/schemas/error"
