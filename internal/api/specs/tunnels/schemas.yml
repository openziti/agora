tunnel:
  type: object
  required:
    - id
    - organizationId
    - environmentId
    - name
    - backendAddress
    - state
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      pattern: '^tt_[a-z0-9]{12}$'
    organizationId:
      type: string
      pattern: '^org_[a-z0-9]{12}$'
    environmentId:
      type: string
      pattern: '^ev_[a-z0-9]{12}$'
    name:
      type: string
    backendAddress:
      type: string
    zitiServiceId:
      type: string
    state:
      type: string
      enum: [active, disabled]
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

createTunnelRequest:
  type: object
  required:
    - environmentId
    - name
    - backendAddress
  properties:
    environmentId:
      type: string
      pattern: '^ev_[a-z0-9]{12}$'
    name:
      type: string
      minLength: 1
    backendAddress:
      type: string
      minLength: 1
    zitiServiceId:
      type: string

listTunnelsResponse:
  type: array
  items:
    $ref: "#/tunnel"
