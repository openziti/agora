tunnel:
  type: object
  required:
    - id
    - organizationId
    - accountId
    - environmentId
    - name
    - mode
    - kind
    - state
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      pattern: '^tt_[a-z0-9]{12}$'
    organizationId:
      type: string
      pattern: '^org_[a-z0-9]{12}$'
    accountId:
      type: string
      pattern: '^ac_[a-z0-9]{12}$'
    environmentId:
      type: string
      pattern: '^ev_[a-z0-9]{12}$'
    name:
      type: string
    mode:
      $ref: "#/tunnelMode"
    kind:
      type: string
      enum: [proxy, direct]
    backendTarget:
      type: string
    zitiServiceId:
      type: string
    bindPolicyId:
      type: string
    serviceEdgeRouterPolicyId:
      type: string
    state:
      type: string
      enum: [active, disabled]
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

tunnelMode:
  type: string
  enum: [http, tcp, udp]

createTunnelRequest:
  type: object
  required:
    - environmentId
    - name
    - mode
  properties:
    environmentId:
      type: string
      pattern: '^ev_[a-z0-9]{12}$'
    name:
      type: string
      minLength: 1
    mode:
      $ref: "#/tunnelMode"
    backendTarget:
      type: string
      minLength: 1
    grantEmails:
      type: array
      items:
        type: string
        format: email

listTunnelsResponse:
  type: array
  items:
    $ref: "#/tunnel"

connectTunnelRequest:
  type: object
  required:
    - environmentId
    - name
  properties:
    environmentId:
      type: string
      pattern: '^ev_[a-z0-9]{12}$'
    name:
      type: string
      minLength: 1
    listenAddress:
      type: string
      minLength: 1

connectTunnelResponse:
  type: object
  required:
    - tunnel
    - attachment
  properties:
    tunnel:
      $ref: "#/tunnel"
    attachment:
      $ref: "#/tunnelAttachment"

startTunnelServeRequest:
  type: object
  required:
    - environmentId
  properties:
    environmentId:
      type: string
      pattern: '^ev_[a-z0-9]{12}$'

tunnelGrant:
  type: object
  required:
    - tunnelId
    - accountId
    - email
    - createdAt
  properties:
    tunnelId:
      type: string
      pattern: '^tt_[a-z0-9]{12}$'
    accountId:
      type: string
      pattern: '^ac_[a-z0-9]{12}$'
    email:
      type: string
      format: email
    createdAt:
      type: string
      format: date-time

addTunnelGrantRequest:
  type: object
  required:
    - email
  properties:
    email:
      type: string
      format: email

listTunnelGrantsResponse:
  type: array
  items:
    $ref: "#/tunnelGrant"

tunnelAttachment:
  type: object
  required:
    - id
    - tunnelId
    - organizationId
    - accountId
    - environmentId
    - kind
    - state
    - lastHeartbeatAt
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      pattern: '^ta_[a-z0-9]{12}$'
    tunnelId:
      type: string
      pattern: '^tt_[a-z0-9]{12}$'
    organizationId:
      type: string
      pattern: '^org_[a-z0-9]{12}$'
    accountId:
      type: string
      pattern: '^ac_[a-z0-9]{12}$'
    environmentId:
      type: string
      pattern: '^ev_[a-z0-9]{12}$'
    accountEmail:
      type: string
      format: email
    tunnelName:
      type: string
    tunnelMode:
      $ref: "#/tunnelMode"
    kind:
      type: string
      enum: [proxy, dialer]
    listenAddress:
      type: string
    dialPolicyId:
      type: string
    state:
      type: string
      enum: [active, stale, disconnected]
    lastHeartbeatAt:
      type: string
      format: date-time
    disconnectedAt:
      type: string
      format: date-time
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

listTunnelAttachmentsResponse:
  type: array
  items:
    $ref: "#/tunnelAttachment"

activeDialerAttachment:
  type: object
  required:
    - attachment
    - tunnelId
    - tunnelMode
  properties:
    attachment:
      $ref: "#/tunnelAttachment"
    tunnelId:
      type: string
      pattern: '^tt_[a-z0-9]{12}$'
    tunnelMode:
      $ref: "#/tunnelMode"

tunnelServe:
  type: object
  required:
    - id
    - tunnelId
    - organizationId
    - accountId
    - environmentId
    - state
    - lastHeartbeatAt
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      pattern: '^ts_[a-z0-9]{12}$'
    tunnelId:
      type: string
      pattern: '^tt_[a-z0-9]{12}$'
    organizationId:
      type: string
      pattern: '^org_[a-z0-9]{12}$'
    accountId:
      type: string
      pattern: '^ac_[a-z0-9]{12}$'
    environmentId:
      type: string
      pattern: '^ev_[a-z0-9]{12}$'
    environmentHost:
      type: string
    tunnelName:
      type: string
    tunnelMode:
      $ref: "#/tunnelMode"
    state:
      type: string
      enum: [active, stale, disconnected]
    lastHeartbeatAt:
      type: string
      format: date-time
    disconnectedAt:
      type: string
      format: date-time
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
