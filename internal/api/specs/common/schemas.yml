error:
  type: object
  required:
    - code
    - message
  properties:
    code:
      type: string
    message:
      type: string

versionInfo:
  type: object
  required:
    - version
  properties:
    version:
      type: string
    hash:
      type: string
    date:
      type: string
    builder:
      type: string
    branch:
      type: string
