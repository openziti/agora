environment:
  type: object
  required:
    - id
    - organizationId
    - accountId
    - zitiIdentityId
    - state
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      pattern: '^ev_[a-z0-9]{12}$'
    organizationId:
      type: string
      pattern: '^org_[a-z0-9]{12}$'
    accountId:
      type: string
      pattern: '^ac_[a-z0-9]{12}$'
    description:
      type: string
    host:
      type: string
    zitiIdentityId:
      type: string
    state:
      type: string
      enum: [enabled, disabled]
    lastSeenAt:
      type: string
      format: date-time
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

createEnvironmentRequest:
  type: object
  required:
    - zitiIdentityId
  properties:
    description:
      type: string
    host:
      type: string
    zitiIdentityId:
      type: string
      minLength: 1

listEnvironmentsResponse:
  type: array
  items:
    $ref: "#/environment"
